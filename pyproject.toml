[project]
name = "recourse"
version = "0.1.0"
description = "An autonomous agent that appeals health-insurance denials, and never misses the clock."
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.54.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pypdf>=5.1",
    "mcp>=1.2",
    # FastAPI parses the EOB upload's multipart body through this. Without it the
    # only route a person starts from raises at import, and the failure reads as a
    # broken app rather than a missing dependency.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# reportlab regenerates the sample EOB PDFs in tests/fixtures. The PDFs are
# committed, so the suite itself never needs it — only `build_samples.py` does.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "reportlab>=4.2"]

[project.scripts]
recourse-api = "recourse.api.app:main"
recourse-mcp = "recourse.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recourse = ["rulebook/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits Amazon Bedrock; billed; needs credentials"]
asyncio_mode = "auto"
